name: CI/CD Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required by getCommitCount() and getCommitSha()
          fetch-depth: 0

      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate temporary testing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore app/testing-debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify keystore
        run: |
          echo "Current directory:"
          pwd
          echo
          echo "Keystore:"
          ls -lah app/testing-debug.keystore

      - name: Build Release APKs
        run: |
          ./gradlew clean assembleRelease \
            -PreleaseKeyStore="testing-debug.keystore" \
            -PreleaseKeyStorePassword="android" \
            -PreleaseKeyAlias="androiddebugkey" \
            -PreleaseKeyPassword="android" \
            --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvNext-arm64-v8a-release-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: warn

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvNext-armeabi-v7a-release-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/**/*armeabi-v7a*.apk
          if-no-files-found: warn

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvNext-universal-release-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/**/*universal*.apk
          if-no-files-found: warn

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvNext-x86-release-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/**/*x86-release*.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvNext-x86_64-release-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/**/*x86_64*.apk
          if-no-files-found: warn